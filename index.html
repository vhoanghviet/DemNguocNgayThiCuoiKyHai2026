<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Cuối Kỳ - 25CTT6</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ẨN THANH TRƯỢT BÊN PHẢI */
        body {
            /* Background đại dương sâu thẳm */
            background: linear-gradient(to bottom, #001e36 0%, #004d7a 40%, #000a14 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
            
            /* Ẩn scrollbar Firefox & IE */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Ẩn scrollbar Chrome, Safari, Edge */
        body::-webkit-scrollbar {
            display: none;
        }

        /* OCEAN ANIMATIONS - ĐÁY BIỂN */
        #ocean-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* San hô đáy biển */
        .seabed {
            position: absolute;
            bottom: -10px;
            width: 100%;
            font-size: 3rem;
            display: flex;
            justify-content: space-around;
            user-select: none;
            filter: drop-shadow(0 -5px 10px rgba(0,0,0,0.8));
        }

        /* Sinh vật biển */
        .fish {
            position: absolute;
            font-size: 3rem;
            white-space: nowrap;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            will-change: transform;
        }

        /* Bọt khí */
        .bubble {
            position: absolute;
            bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* MAIN CONTENT */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #e0f2fe, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        /* GRID SYSTEM */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        /* GLASSMORPHISM CARDS */
        .card {
            background: rgba(0, 50, 100, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: border 0.3s ease, transform 0.1s ease;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .card:hover {
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.2);
        }

        /* HIỆU ỨNG VẾT NỨT KÍNH */
        .crack-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            height: 2px;
            transform-origin: left center;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        /* MẢNH VỠ KÍNH RƠI XUỐNG */
        .shard {
            position: fixed;
            background: rgba(100, 200, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            z-index: 9999;
            pointer-events: none;
        }

        /* STYLES CŨ GIỮ NGUYÊN */
        .subject-icon { font-size: 3rem; margin-bottom: 1rem; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .subject-name { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; color: #f8fafc; min-height: 3rem; }
        .exam-date { font-size: 0.9rem; color: #94a3b8; margin-bottom: 1.5rem; }
        .timer { display: flex; gap: 1rem; justify-content: center; width: 100%; }
        .time-box { display: flex; flex-direction: column; align-items: center; }
        .time-value { font-size: 2rem; font-weight: 700; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); font-variant-numeric: tabular-nums; }
        .time-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.2rem; }
        .finished-text { font-size: 1.5rem; font-weight: 700; color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.4); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; max-width: 400px; }
        }

        /* NỔ HẠT (Thay màu cho hợp biển) */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: pop 0.6s cubic-bezier(0, 0.9, 0.9, 0.99) forwards;
            z-index: 9999;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes pop {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ocean-bg">
        <div class="seabed">
            <span>🪸</span><span>🌿</span><span>🐚</span><span>🪸</span><span>🌿</span><span>🦀</span><span>🪸</span>
        </div>
    </div>

    <div class="content">
        <header>
            <h1>Countdown Cuối Kỳ</h1>
        </header>

        <div class="grid" id="exam-grid">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // ==========================================
        // 1. DATA MÔN THI & RENDER GIAO DIỆN
        // ==========================================
        const exams = [
            { id: 1, name: "Cấu trúc dữ liệu & Giải thuật", date: "2026-06-30T00:00:00", icon: "💻" },
            { id: 2, name: "Đại số tuyến tính", date: "2026-07-03T00:00:00", icon: "📐" },
            { id: 3, name: "Pháp luật đại cương", date: "2026-07-07T00:00:00", icon: "⚖️" },
            { id: 4, name: "Vi tích phân 2", date: "2026-07-08T00:00:00", icon: "∫" },
            { id: 5, name: "Vật lý đại cương 1 (Cơ-Nhiệt)", date: "2026-07-17T00:00:00", icon: "⚛️" }
        ];

        const grid = document.getElementById('exam-grid');

        exams.forEach(exam => {
            const formattedDate = new Date(exam.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const cardHTML = `
                <div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.3" data-tilt-scale="1.05" id="card-${exam.id}">
                    <div class="subject-icon">${exam.icon}</div>
                    <div class="subject-name">${exam.name}</div>
                    <div class="exam-date">Ngày thi: ${formattedDate}</div>
                    <div class="timer" id="timer-${exam.id}">
                        <div class="time-box"><span class="time-value" id="days-${exam.id}">00</span><span class="time-label">Ngày</span></div>
                        <div class="time-box"><span class="time-value" id="hours-${exam.id}">00</span><span class="time-label">Giờ</span></div>
                        <div class="time-box"><span class="time-value" id="mins-${exam.id}">00</span><span class="time-label">Phút</span></div>
                        <div class="time-box"><span class="time-value" id="secs-${exam.id}">00</span><span class="time-label">Giây</span></div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });

        // Kích hoạt Tilt 3D
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 15, speed: 400, glare: true, "max-glare": 0.2 });

        // ==========================================
        // 2. LOGIC ĐẾM NGƯỢC
        // ==========================================
        function updateTimers() {
            const now = new Date().getTime();
            exams.forEach(exam => {
                const distance = new Date(exam.date).getTime() - now;
                const timerElement = document.getElementById(`timer-${exam.id}`);

                if (distance < 0) {
                    timerElement.innerHTML = `<span class="finished-text">Đã thi xong! 🎉</span>`;
                    return;
                }

                document.getElementById(`days-${exam.id}`).innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById(`hours-${exam.id}`).innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById(`mins-${exam.id}`).innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById(`secs-${exam.id}`).innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
            });
        }
        setInterval(updateTimers, 1000);
        updateTimers();

        // ==========================================
        // 3. HIỆU ỨNG ĐÁY BIỂN (CÁ VÀ BỌT KHÍ)
        // ==========================================
        const oceanBg = document.getElementById('ocean-bg');
        const seaCreatures = [
            '🦈', '🐋', '🐬', '🐡', '🐠', '🐟', '🐙', '🦑', 
            '🐡💡' // Tượng trưng cho cá đèn lồng
        ];

        // Tạo bọt khí ngẫu nhiên
        setInterval(() => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 15 + 5;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}vw`;
            bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
            oceanBg.appendChild(bubble);
            setTimeout(() => bubble.remove(), 10000);
        }, 300);

        // Tạo cá bơi lội
        setInterval(() => {
            const fish = document.createElement('div');
            fish.className = 'fish';
            fish.innerText = seaCreatures[Math.floor(Math.random() * seaCreatures.length)];
            
            const startY = Math.random() * 80 + 10; // 10% -> 90% chiều cao
            const duration = Math.random() * 15000 + 10000; // 10s - 25s
            const isRightToLeft = Math.random() > 0.5;

            fish.style.top = `${startY}vh`;
            
            if (isRightToLeft) {
                fish.style.left = `110vw`;
                fish.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-120vw)' }
                ], { duration, fill: 'forwards' });
            } else {
                fish.style.left = `-10vw`;
                // Xoay chiều cá nếu bơi từ trái sang phải
                fish.style.transform = `scaleX(-1)`;
                fish.animate([
                    { transform: 'translateX(0) scaleX(-1)' },
                    { transform: 'translateX(120vw) scaleX(-1)' }
                ], { duration, fill: 'forwards' });
            }

            oceanBg.appendChild(fish);
            setTimeout(() => fish.remove(), duration);
        }, 2000); // 2 giây sinh 1 con cá

        // ==========================================
        // 4. HIỆU ỨNG ĐẬP VỠ BOX (SHATTER EFFECT)
        // ==========================================
        grid.addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            if (!card) return;

            let clicks = parseInt(card.dataset.clicks || 0) + 1;
            card.dataset.clicks = clicks;

            const rect = card.getBoundingClientRect();
            // Lấy toạ độ click tương đối so với card
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (clicks <= 2) {
                // TẠO VẾT NỨT
                for(let i = 0; i < 4; i++) {
                    const crack = document.createElement('div');
                    crack.className = 'crack-line';
                    crack.style.left = `${clickX}px`;
                    crack.style.top = `${clickY}px`;
                    crack.style.width = `${Math.random() * 100 + 50}px`;
                    crack.style.transform = `rotate(${Math.random() * 360}deg)`;
                    card.appendChild(crack);
                }
                // Hơi rụt card lại
                card.style.transform = `scale(${1 - clicks * 0.03})`;
                card.style.boxShadow = `inset 0 0 ${clicks * 20}px rgba(255, 255, 255, 0.2)`;
            
            } else if (clicks === 3) {
                // VỠ TAN THÀNH MẢNH
                card.style.visibility = 'hidden';
                
                for(let i = 0; i < 20; i++) {
                    const shard = document.createElement('div');
                    shard.className = 'shard';
                    
                    const size = Math.random() * 50 + 30;
                    shard.style.width = `${size}px`;
                    shard.style.height = `${size}px`;
                    
                    // Cắt thành hình tam giác mảnh vỡ
                    shard.style.clipPath = `polygon(${Math.random()*100}% 0, 100% ${Math.random()*100}%, 0 ${Math.random()*100}%)`;
                    
                    // Vị trí xuất phát của mảnh vỡ
                    shard.style.left = `${rect.left + Math.random() * rect.width}px`;
                    shard.style.top = `${rect.top + Math.random() * rect.height}px`;
                    
                    document.body.appendChild(shard);
                    
                    // Hiệu ứng rơi xuống đáy (Đáy = window.innerHeight)
                    const dropDuration = Math.random() * 1500 + 1000;
                    const dropX = (Math.random() - 0.5) * 300; 
                    const dropY = window.innerHeight - rect.top + 100; // Đảm bảo rớt hẳn khỏi khung hình
                    const rotate = Math.random() * 720 - 360;
                    
                    shard.animate([
                        { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
                        { transform: `translate(${dropX}px, ${dropY}px) rotate(${rotate}deg)`, opacity: 0 }
                    ], { duration: dropDuration, easing: 'cubic-bezier(0.5, 0, 1, 1)', fill: 'forwards' });
                    
                    // Xoá mảnh vỡ khỏi DOM sau khi rớt xong
                    setTimeout(() => shard.remove(), dropDuration);
                }

                // HỒI SINH SAU 60 GIÂY
                setTimeout(() => {
                    card.style.visibility = 'visible';
                    card.dataset.clicks = 0;
                    card.style.transform = 'scale(1)';
                    card.style.boxShadow = '';
                    // Xoá các vết nứt cũ
                    card.querySelectorAll('.crack-line').forEach(el => el.remove());
                }, 60000); 
            }
        });

        // ==========================================
        // 5. HIỆU ỨNG NỔ BONG BÓNG KHI CLICK CHUỘT
        // ==========================================
        document.addEventListener('click', function(e) {
            const colors = ['#87CEFA', '#E0FFFF', '#FFFFFF', '#00FFFF']; // Màu bọt nước
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 4; 
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * Math.PI * 2;
                const velocity = 30 + Math.random() * 50; 
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.left = `${e.clientX - size/2}px`;
                particle.style.top = `${e.clientY - size/2}px`;
                particle.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                particle.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        });
    </script>
</body>
</html>
