<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Cuối Kỳ - 25CTT6</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        /* GLOWING BLOB FOLLOWER */
        #blob {
            background: linear-gradient(to right, #00f2fe, #4facfe, #00f2fe);
            height: 400px;
            aspect-ratio: 1;
            position: fixed;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            border-radius: 50%;
            animation: rotate 20s infinite;
            filter: blur(150px);
            z-index: 0;
            opacity: 0.6;
            pointer-events: none; /* Không ngăn cản tương tác chuột với các thẻ */
        }

        @keyframes rotate {
            from { rotate: 0deg; }
            50% { scale: 1 1.5; }
            to { rotate: 360deg; }
        }

        /* BLUR LAYER FOR GLASSMORPHISM */
        #blur-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        /* MAIN CONTENT */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* GRID SYSTEM */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        /* GLASSMORPHISM CARDS */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: border 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .subject-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .subject-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #f8fafc;
            min-height: 3rem; /* Đồng bộ chiều cao tên môn */
        }

        .exam-date {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        /* TIMER STYLES */
        .timer {
            display: flex;
            gap: 1rem;
            justify-content: center;
            width: 100%;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        .finished-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        /* ANIMATIONS */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; max-width: 400px; }
        }
        /* HIỆU ỨNG NỔ HẠT KHI CLICK */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            animation: pop 0.6s cubic-bezier(0, 0.9, 0.9, 0.99) forwards;
            z-index: 9999;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes pop {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="blob"></div>
    <div id="blur-layer"></div>

    <div class="content">
        <header>
            <h1>Countdown Cuối Kỳ</h1>
        </header>

        <div class="grid" id="exam-grid">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // HIỆU ỨNG ÁNH SÁNG CHẠY THEO CHUỘT
        const blob = document.getElementById("blob");
        document.body.onpointermove = event => { 
            const { clientX, clientY } = event;
            blob.animate({
                left: `${clientX}px`,
                top: `${clientY}px`
            }, { duration: 3000, fill: "forwards" });
        }

        // DATA CÁC MÔN THI (Đã sắp xếp theo thời gian)
        const exams = [
            { id: 1, name: "Cấu trúc dữ liệu & Giải thuật", date: "2026-06-30T00:00:00", icon: "💻" },
            { id: 2, name: "Đại số tuyến tính", date: "2026-07-03T00:00:00", icon: "📐" },
            { id: 3, name: "Pháp luật đại cương", date: "2026-07-07T00:00:00", icon: "⚖️" },
            { id: 4, name: "Vi tích phân 2", date: "2026-07-08T00:00:00", icon: "∫" },
            { id: 5, name: "Vật lý đại cương 1 (Cơ-Nhiệt)", date: "2026-07-17T00:00:00", icon: "⚛️" }
        ];

        const grid = document.getElementById('exam-grid');

        // TẠO GIAO DIỆN CÁC THẺ MÔN HỌC
        exams.forEach(exam => {
            const formattedDate = new Date(exam.date).toLocaleDateString('vi-VN', {
                day: '2-digit', month: '2-digit', year: 'numeric'
            });

            const cardHTML = `
                <div class="card" data-tilt data-tilt-glare data-tilt-max-glare="0.3" data-tilt-scale="1.05">
                    <div class="subject-icon">${exam.icon}</div>
                    <div class="subject-name">${exam.name}</div>
                    <div class="exam-date">Ngày thi: ${formattedDate}</div>
                    <div class="timer" id="timer-${exam.id}">
                        <div class="time-box">
                            <span class="time-value" id="days-${exam.id}">00</span>
                            <span class="time-label">Ngày</span>
                        </div>
                        <div class="time-box">
                            <span class="time-value" id="hours-${exam.id}">00</span>
                            <span class="time-label">Giờ</span>
                        </div>
                        <div class="time-box">
                            <span class="time-value" id="mins-${exam.id}">00</span>
                            <span class="time-label">Phút</span>
                        </div>
                        <div class="time-box">
                            <span class="time-value" id="secs-${exam.id}">00</span>
                            <span class="time-label">Giây</span>
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });

        // LOGIC ĐẾM NGƯỢC
        function updateTimers() {
            const now = new Date().getTime();

            exams.forEach(exam => {
                const countDownDate = new Date(exam.date).getTime();
                const distance = countDownDate - now;

                const timerElement = document.getElementById(`timer-${exam.id}`);

                if (distance < 0) {
                    timerElement.innerHTML = `<span class="finished-text">Đã thi xong! 🎉</span>`;
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Thêm số 0 ở trước nếu nhỏ hơn 10
                document.getElementById(`days-${exam.id}`).innerText = days < 10 ? "0" + days : days;
                document.getElementById(`hours-${exam.id}`).innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById(`mins-${exam.id}`).innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById(`secs-${exam.id}`).innerText = seconds < 10 ? "0" + seconds : seconds;
            });
        }

        // Khởi chạy đếm ngược mỗi giây
        setInterval(updateTimers, 1000);
        updateTimers();

        // Kích hoạt hiệu ứng 3D Tilt cho các thẻ vừa tạo
        VanillaTilt.init(document.querySelectorAll(".card"), {
            max: 15,
            speed: 400,
            glare: true,
            "max-glare": 0.2
        });
        // HIỆU ỨNG NỔ HẠT KHI CLICK CHUỘT
        document.addEventListener('click', function(e) {
            // Mảng màu sắc của các hạt (xanh ngọc, xanh dương, trắng, tím nhạt)
            const colors = ['#00f2fe', '#38bdf8', '#ffffff', '#a5b4fc'];
            
            // Tạo 15 hạt cho mỗi lần click
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random kích thước, màu sắc và hướng bay
                const size = Math.random() * 6 + 4; 
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * Math.PI * 2;
                const velocity = 40 + Math.random() * 60; // Tốc độ bay
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                // Gán thuộc tính cho hạt
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.color = color;
                particle.style.backgroundColor = color;
                particle.style.left = `${e.clientX - size/2}px`;
                particle.style.top = `${e.clientY - size/2}px`;
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                document.body.appendChild(particle);
                
                // Dọn dẹp DOM sau khi hiệu ứng chạy xong (0.6s)
                setTimeout(() => {
                    particle.remove();
                }, 600);
            }
        });
    </script>
</body>
</html>
